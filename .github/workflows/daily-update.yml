name: Daily market refresh

on:
  workflow_dispatch:
  schedule:
    # 23:15 UTC = 19:15 EDT / 18:15 EST: after US market closes.
    # Runs every calendar day. Non-trading days retain latest market candle with its actual date.
    - cron: '15 23 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-dashboard-refresh
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run deterministic scoring tests
        run: python -m unittest discover -s tests -v
      - name: Retrieve fresh data and calculate scores
        run: python scripts/update_data.py
      - name: Preserve score history in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json site/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily market data $(date -u +%F)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
